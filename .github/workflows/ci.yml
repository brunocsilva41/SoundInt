# ============================================================================
# CI — build unico + testes por PARTE em paralelo.
#   build  : checkout -> cmake x64 -> build Debug -> ctest (unit/app_policy)
#            -> publica os .exe das suites como artefato.
#   test   : matriz (core/audio/ui/update/app/full) roda cada suite em um job
#            proprio, baixando o artefato do build. fail-fast: false => uma
#            parte vermelha nao esconde as demais; "Re-run failed jobs"
#            refaz somente a parte que falhou (o build nao repete).
# Sem segredos: permissions contents:read.
# ============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Etapa 1 — build: compila Debug x64 uma vez e roda o ctest registrado.
  # ---------------------------------------------------------------------------
  build:
    name: "1 - build (Windows x64 Debug)"
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar (CMake x64)
        run: cmake -B build -A x64

      - name: Compilar (Debug)
        run: cmake --build build --config Debug --parallel

      - name: Testes registrados no CMake (ctest)
        run: ctest --test-dir build -C Debug --output-on-failure

      - name: Publicar binarios das suites
        uses: actions/upload-artifact@v7
        with:
          name: test-exes
          path: build/Debug/soundint_tests*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Artefatos de diagnostico em falha
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-build-failure-${{ github.run_id }}
          path: |
            build/Testing/**
            build/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Etapa 2 — test: uma job por parte, em paralelo. Cada suite e independente:
  # falhou uma => so ela aparece vermelha e o re-run refaz so ela.
  # ---------------------------------------------------------------------------
  test:
    name: "2 - test (${{ matrix.suite }})"
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [core, audio, ui, update, app, full]
    steps:
      - name: Baixar binarios das suites
        uses: actions/download-artifact@v8
        with:
          name: test-exes
          path: bin

      - name: Executar suite ${{ matrix.suite }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $suite = '${{ matrix.suite }}'
          $exe = if ($suite -eq 'full') {
            'bin\soundint_tests.exe'
          } else {
            "bin\soundint_tests_$suite.exe"
          }
          if (-not (Test-Path $exe)) { throw "Suite nao encontrada: $exe" }
          Write-Host "::group::Executando $exe"
          & $exe
          $code = $LASTEXITCODE
          Write-Host "::endgroup::"
          if ($code -ne 0) { throw "Suite $suite falhou (exit code $code)" }
          Write-Host "Suite $suite OK."

      - name: Logs em falha
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-test-${{ matrix.suite }}-failure-${{ github.run_id }}
          path: |
            **/*.log
            C:\Users\runneradmin\AppData\Local\SoundInt\logs\**
          if-no-files-found: ignore
          retention-days: 7
